<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>書店及文創多分店進銷存與寄售系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    @media print {
      body * { visibility: hidden; }
      #printArea, #printArea * { visibility: visible; }
      #printArea { position: absolute; left: 0; top: 0; width: 100%; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8 font-sans">

  <!-- 🔒 登入視窗 (預設顯示) -->
  <div id="loginView" class="max-w-md mx-auto bg-white rounded-2xl shadow-md border p-6 mt-12">
    <h2 class="text-xl font-bold text-slate-900 mb-2 text-center">📚 系統登入</h2>
    <p class="text-xs text-slate-500 mb-6 text-center">請輸入員工帳號與密碼以繼續</p>
    
    <form onsubmit="handleLogin(event)" class="space-y-4 text-xs">
      <div>
        <label class="font-bold text-slate-700 block mb-1">Email 帳號</label>
        <input type="email" id="loginEmail" required placeholder="user@example.com" class="w-full p-2.5 border rounded-lg">
      </div>
      <div>
        <label class="font-bold text-slate-700 block mb-1">密碼</label>
        <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full p-2.5 border rounded-lg">
      </div>
      <p id="loginError" class="text-red-500 text-xs hidden"></p>
      <button type="submit" id="loginBtn" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-bold hover:bg-blue-700 transition">登入系統</button>
    </form>
  </div>

  <!-- 📦 主系統介面 (未登入前隱藏) -->
  <div id="appView" class="hidden max-w-6xl mx-auto bg-white rounded-2xl shadow-sm border p-6 no-print">
    
    <!-- 頂部 Header & 分頁頁簽 -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center pb-4 border-b gap-4">
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-xl font-bold text-slate-900">📚 書店多分店進銷存與寄售系統</h1>
          <span class="bg-slate-100 text-slate-500 text-xs px-2 py-0.5 rounded-full border">內部專用</span>
        </div>
        <p class="text-xs text-slate-500 mt-1">支持 3 間分店：觀塘店 / 西營盤店 / 荃灣店</p>
      </div>

      <!-- 右上角使用者資訊與登出按鈕 -->
      <div class="flex items-center gap-3">
        <span id="userEmailTag" class="text-xs font-semibold text-slate-600 bg-slate-100 px-3 py-1.5 rounded-lg"></span>
        <button onclick="handleLogout()" class="text-xs bg-red-50 text-red-600 font-bold px-3 py-1.5 rounded-lg border border-red-100 hover:bg-red-100">登出</button>
      </div>
      
      <!-- 分頁切換按鈕 -->
      <div class="flex bg-slate-100 p-1 rounded-xl border">
        <button id="tabBtnBooks" onclick="switchTab('books')" class="px-4 py-2 text-xs font-bold rounded-lg bg-white shadow-sm text-blue-600">📖 書籍管理</button>
        <button id="tabBtnCrafts" onclick="switchTab('crafts')" class="px-4 py-2 text-xs font-bold rounded-lg text-slate-600 hover:text-slate-900">🎨 文創商品</button>
        <button id="tabBtnConsign" onclick="switchTab('consign')" class="px-4 py-2 text-xs font-bold rounded-lg text-slate-600 hover:text-slate-900">📄 寄售單據</button>
      </div>
    </div>

    <!-- TAB 1: 書籍管理 -->
    <div id="tabBooks" class="tab-content mt-6">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <div class="bg-blue-50/50 border border-blue-100 p-4 rounded-xl">
          <p class="text-xs text-slate-500 font-medium">現有庫存 (在地)</p>
          <p id="statStock" class="text-2xl font-bold text-blue-900 mt-1">0 本</p>
        </div>
        <div class="bg-emerald-50/50 border border-emerald-100 p-4 rounded-xl">
          <p class="text-xs text-slate-500 font-medium">累計售出本數</p>
          <p id="statSold" class="text-2xl font-bold text-emerald-900 mt-1">0 本</p>
        </div>
        <div class="bg-amber-50/50 border border-amber-100 p-4 rounded-xl">
          <p class="text-xs text-slate-500 font-medium">總銷售金額 (HKD)</p>
          <p id="statRevenue" class="text-2xl font-bold text-amber-900 mt-1">$ 0</p>
        </div>
      </div>

      <div class="bg-slate-50 p-4 rounded-xl border mb-6">
        <div class="flex justify-between items-center mb-3">
          <h2 class="text-xs font-bold text-slate-700">進貨與書籍搜尋</h2>
          <button onclick="openBookModal()" class="bg-blue-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg hover:bg-blue-700">+ 手動新增書籍 / 作者寄售</button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <div>
            <label class="text-xs text-slate-500 mb-1 block">1. ISBN 條碼搜尋：</label>
            <div class="flex gap-2">
              <input type="text" id="isbnInput" placeholder="輸入或掃描 ISBN" class="w-full text-xs p-2.5 border rounded-lg bg-white">
              <button onclick="searchISBN()" class="bg-blue-600 text-white px-4 text-xs font-bold rounded-lg hover:bg-blue-700 whitespace-nowrap">搜尋</button>
            </div>
          </div>
          <div>
            <label class="text-xs text-slate-500 mb-1 block">2. 📸 拍照/上傳封面找書：</label>
            <label class="flex items-center justify-center bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold py-2.5 px-4 rounded-lg cursor-pointer transition">
              <span>📸 拍照/上傳封面</span>
              <input type="file" id="coverImageInput" accept="image/*" class="hidden" onchange="uploadCoverAndSearch(this)">
            </label>
          </div>
          <div>
            <label class="text-xs text-slate-500 mb-1 block">3. 相機掃描碼：</label>
            <button onclick="toggleScanner()" class="w-full bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold py-2.5 px-4 rounded-lg">開啟相機鏡頭</button>
          </div>
        </div>
      </div>

      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-bold text-slate-800">庫存與銷售紀錄</h2>
        <div class="flex gap-2">
          <input type="text" id="bookSearchKeyword" onkeyup="filterBooks()" placeholder="搜尋書名 / ISBN / 作者..." class="text-xs p-2 border rounded-lg w-48">
          <select id="storeFilter" onchange="filterBooks()" class="text-xs p-2 border rounded-lg">
            <option value="全部">分店：全部分店</option>
            <option value="觀塘店">觀塘店</option>
            <option value="西營盤店">西營盤店</option>
            <option value="荃灣店">荃灣店</option>
          </select>
        </div>
      </div>

      <div class="overflow-x-auto border rounded-xl">
        <table class="w-full text-left text-xs text-slate-600">
          <thead class="bg-slate-100 text-slate-700 font-bold border-b">
            <tr>
              <th class="p-3 w-14">封面</th>
              <th class="p-3">書名</th>
              <th class="p-3">屬性/條款</th>
              <th class="p-3">分店</th>
              <th class="p-3">ISBN</th>
              <th class="p-3">單價</th>
              <th class="p-3">數量</th>
              <th class="p-3">狀態</th>
              <th class="p-3">操作</th>
            </tr>
          </thead>
          <tbody id="bookTableBody" class="divide-y"></tbody>
        </table>
      </div>
    </div>

    <!-- TAB 2: 文創商品 -->
    <div id="tabCrafts" class="tab-content hidden mt-6">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-sm font-bold text-slate-800">文創商品清單</h2>
        <button onclick="openCraftModal()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-xs font-bold hover:bg-indigo-700">+ 新增文創商品</button>
      </div>
      <div class="overflow-x-auto border rounded-xl">
        <table class="w-full text-left text-xs text-slate-600">
          <thead class="bg-slate-100 text-slate-700 font-bold border-b">
            <tr>
              <th class="p-3 w-14">相片</th>
              <th class="p-3">商品名稱</th>
              <th class="p-3">創作者/品牌</th>
              <th class="p-3">IG/電話</th>
              <th class="p-3">分店</th>
              <th class="p-3">售價</th>
              <th class="p-3">庫存</th>
              <th class="p-3">操作</th>
            </tr>
          </thead>
          <tbody id="craftTableBody" class="divide-y"></tbody>
        </table>
      </div>
    </div>

    <!-- TAB 3: 寄售單與收據 -->
    <div id="tabConsign" class="tab-content hidden mt-6">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-sm font-bold text-slate-800">寄售紀錄與單據清單</h2>
        <button onclick="openConsignmentModal()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-xs font-bold hover:bg-emerald-700">+ 開立新寄售單</button>
      </div>
      <div class="overflow-x-auto border rounded-xl">
        <table class="w-full text-left text-xs text-slate-600">
          <thead class="bg-slate-100 text-slate-700 font-bold border-b">
            <tr>
              <th class="p-3">單號</th>
              <th class="p-3">寄售人/單位</th>
              <th class="p-3">聯絡電話</th>
              <th class="p-3">存放分店</th>
              <th class="p-3">總金額</th>
              <th class="p-3">建立日期</th>
              <th class="p-3">操作</th>
            </tr>
          </thead>
          <tbody id="consignTableBody" class="divide-y"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://gkfudwnkkrabhnmvifop.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdrZnVkd25ra3JhYmhubXZpZm9wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNzg5NjAsImV4cCI6MjEwMzc1NDk2MH0.r3cEqVpdR0PD4TFu_2QOhDOqLiwWh5FHUVmpa168Fuk";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let dbBooks = [];
    let dbCrafts = [];
    let consignItems = [];

    // 🔑 監聽登入狀態
    document.addEventListener("DOMContentLoaded", () => {
      supabaseClient.auth.onAuthStateChange((event, session) => {
        if (session) {
          // 已登入 -> 顯示系統，隱藏登入頁
          document.getElementById('loginView').classList.add('hidden');
          document.getElementById('appView').classList.remove('hidden');
          document.getElementById('userEmailTag').innerText = session.user.email;
          initData();
        } else {
          // 未登入 -> 顯示登入頁，隱藏系統
          document.getElementById('loginView').classList.remove('hidden');
          document.getElementById('appView').classList.add('hidden');
        }
      });
    });

    // 登入功能
    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const errorEl = document.getElementById('loginError');
      const btn = document.getElementById('loginBtn');

      errorEl.classList.add('hidden');
      btn.innerText = "登入中...";
      btn.disabled = true;

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      btn.innerText = "登入系統";
      btn.disabled = false;

      if (error) {
        errorEl.innerText = "登入失敗：" + error.message;
        errorEl.classList.remove('hidden');
      }
    }

    // 登出功能
    async function handleLogout() {
      await supabaseClient.auth.signOut();
    }

    // 載入資料
    async function initData() {
      await loadBooks();
      await loadCrafts();
      await loadConsignments();
    }

    // 切換 TAB
    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.remove('hidden');
    }

    async function loadBooks() {
      const { data } = await supabaseClient.from('books').select('*');
      dbBooks = data || [];
      renderBooks();
    }

    async function loadCrafts() {
      const { data } = await supabaseClient.from('craft_items').select('*');
      dbCrafts = data || [];
      renderCrafts();
    }

    async function loadConsignments() {
      const { data } = await supabaseClient.from('consignments').select('*');
      consignItems = data || [];
      renderConsignments();
    }

    function renderBooks() {
      const tbody = document.getElementById('bookTableBody');
      tbody.innerHTML = dbBooks.map(b => `
        <tr>
          <td class="p-3"><img src="${b.cover_url || ''}" class="w-10 h-14 object-cover rounded"></td>
          <td class="p-3 font-bold">${b.title || '-'}</td>
          <td class="p-3">${b.is_consignment ? '寄售' : '買斷'}</td>
          <td class="p-3">${b.store || '-'}</td>
          <td class="p-3">${b.isbn || '-'}</td>
          <td class="p-3">$${b.price || 0}</td>
          <td class="p-3">${b.stock || 0}</td>
          <td class="p-3">${b.status || '上架'}</td>
          <td class="p-3">-</td>
        </tr>
      `).join('');
    }

    function renderCrafts() {
      const tbody = document.getElementById('craftTableBody');
      tbody.innerHTML = dbCrafts.map(c => `
        <tr>
          <td class="p-3"><img src="${c.image_url || ''}" class="w-10 h-10 object-cover rounded"></td>
          <td class="p-3 font-bold">${c.title || '-'}</td>
          <td class="p-3">${c.creator || '-'}</td>
          <td class="p-3">${c.contact || '-'}</td>
          <td class="p-3">${c.store || '-'}</td>
          <td class="p-3">$${c.price || 0}</td>
          <td class="p-3">${c.stock || 0}</td>
          <td class="p-3">-</td>
        </tr>
      `).join('');
    }

    function renderConsignments() {
      const tbody = document.getElementById('consignTableBody');
      tbody.innerHTML = consignItems.map(c => `
        <tr>
          <td class="p-3 font-bold">${c.consignment_no || '-'}</td>
          <td class="p-3">${c.consigner_name || '-'}</td>
          <td class="p-3">${c.phone || '-'}</td>
          <td class="p-3">${c.store || '-'}</td>
          <td class="p-3">$${c.total_amount || 0}</td>
          <td class="p-3">${c.created_at ? c.created_at.split('T')[0] : '-'}</td>
          <td class="p-3">-</td>
        </tr>
      `).join('');
    }
  </script>
</body>
</html>
